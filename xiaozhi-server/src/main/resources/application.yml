# ============================================================
# Configuração comum (compartilhada por todos os ambientes)
# ============================================================

server:
  port: 8091
  tomcat:
    mbeanregistry:
      enabled: true  # Habilita o MBean do Tomcat, obtendo automaticamente tomcat_global_sent/received_bytes_total

# ============================================================
# Configuração do MyBatis
# ============================================================
mybatis:
  mapper-locations: classpath*:mapper/*.xml,classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false

# ============================================================
# Configuração da fonte de dados
# ============================================================
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 300000
      pool-name: DatebookHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
      keepalive-time: 30000
      register-mbeans: true

  # Configuração de cache Redis
  cache:
    type: redis

  # Gerenciamento de versão do banco de dados via Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
    validate-on-migrate: false

  data:
    redis:
      # Endereço do servidor Redis (compartilhado automaticamente entre Spring Data Redis e Redisson)
      host: localhost
      port: 6379
      database: 0
      # Configuração do pool de conexões Lettuce (pool desativado por padrão; todas as threads compartilham uma única conexão, o que pode virar gargalo em alta concorrência)
      lettuce:
        pool:
          max-active: 16    # Número máximo de conexões ativas
          max-idle: 8       # Número máximo de conexões ociosas
          min-idle: 2       # Número mínimo de conexões ociosas
          max-wait: 3s      # Tempo máximo de espera para obter uma conexão
      # Arquivo de configuração avançada do Redisson (usado para lock distribuído, bloom filter e outros recursos avançados)
      redisson:
        config: classpath:redisson-config.yml

  # Configuração de upload de arquivos
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # Configuração do JMX
  jmx:
    enabled: false

  # Threads virtuais
  threads:
    virtual:
      enabled: true

  # Configuração de recursos estáticos
  web:
    resources:
      add-mappings: true

  # Perfil ativo (padrão: ambiente de desenvolvimento)
  profiles:
    active: dev

  # Configuração do cliente MCP
  ai:
    mcp:
      client:
        name: XiaoZhi-MCP-Client
        version: 1.0.0
        request-timeout: 60s

# ============================================================
# Configuração de log
# ============================================================
logging:
  level:
    root: INFO
    org.springframework: INFO
    io.github.imfangs.dify.client.impl.StreamEventDispatcher: ERROR
    io.netty.handler: ERROR

# ============================================================
# Configurações específicas do Xiaozhi
# ============================================================
xiaozhi:
  runtime:
    # Em produção, recomenda-se usar caminhos absolutos, para que os diretórios de modelos e bibliotecas nativas não dependam do diretório de trabalho na inicialização
    native-lib-dir: lib
    vosk-model-dir: models/vosk-model
    tts-models-dir: models/tts
  vad:
    model:
      path: models/silero_vad.onnx
  check:
    inactive:
      session: true

# ============================================================
# Configuração do SpringDoc OpenAPI
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /v3/api-docs

# ============================================================
# Configuração do framework de autenticação Sa-Token
# ============================================================
sa-token:
  # Nome do Token (também usado como nome do cookie)
  token-name: Authorization

  # Validade do Token (em segundos); 30 dias = 2592000 segundos, -1 significa que nunca expira
  timeout: 2592000

  # Frequência mínima de atividade do Token (em segundos); se o token ficar sem acesso ao sistema por mais tempo que isso, é congelado; -1 significa sem limite
  active-timeout: -1

  # Se a mesma conta pode ficar logada em vários lugares ao mesmo tempo (true permite login simultâneo; false faz o novo login substituir o anterior)
  is-concurrent: true

  # Quando várias sessões usam a mesma conta, se compartilham o mesmo token (true: todos os logins compartilham um único token; false: cada login gera um novo token)
  is-share: false

  # Estilo do Token (uuid, simple-uuid, random-32, random-64, random-128, tik)
  token-style: uuid

  # Se deve registrar logs de operação
  is-log: false

  # Se o token deve ser lido do cookie
  is-read-cookie: true

  # Se o token deve ser lido do header
  is-read-header: true

  # Prefixo do token; por exemplo, ao definir "Bearer", o cliente deve enviar: Bearer {token}
  token-prefix: Bearer

  # Chave secreta do JWT (obrigatória ao usar o modo JWT Simple; mínimo de 32 caracteres)
  jwt-secret-key: xiaozhi-esp32-server-java-jwt-secret-key

