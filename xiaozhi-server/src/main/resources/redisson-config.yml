# Configuração avançada do Redisson
# Usado apenas para lock distribuído (CacheHelper) e bloom filter (BloomFilterManager),
# as operações comuns do Redis (cache, Pub/Sub, registro de dispositivos) usam o pool de conexões do Lettuce.

# Tempo limite de conexão (ms)
connectTimeout: 10000

# Tempo limite de comando (ms)
timeout: 3000

# Tamanho do pool de conexões
connectionPoolSize: 16

# Número mínimo de conexões ociosas
connectionMinimumIdleSize: 4

# Tamanho do pool de conexões de assinatura (usado internamente pelo Redisson para heartbeat, não para o Pub/Sub de negócio)
subscriptionConnectionPoolSize: 5

# Número mínimo de conexões de assinatura ociosas
subscriptionConnectionMinimumIdleSize: 1

# Intervalo de monitoramento de DNS (ms)
dnsMonitoringInterval: 5000

# Codec (usado para serialização)
codec: !<org.redisson.codec.JsonJacksonCodec> {}

# Quantidade de threads do pool
threads: 16

# Quantidade de threads do pool Netty
nettyThreads: 32

# Modo de transporte
transportMode: "NIO"
