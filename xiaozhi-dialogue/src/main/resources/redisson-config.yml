# Configuração avançada do Redisson
# Usado apenas para lock distribuído (CacheHelper) e filtro de Bloom (BloomFilterManager),
# Operações comuns do Redis (cache, Pub/Sub, registro de dispositivos) usam o pool de conexões Lettuce.

# Tempo limite de conexão (milissegundos)
connectTimeout: 10000

# Tempo limite de comando (milissegundos)
timeout: 3000

# Tamanho do pool de conexões
connectionPoolSize: 16

# Número mínimo de conexões ociosas
connectionMinimumIdleSize: 4

# Tamanho do pool de conexões de assinatura (usado internamente pelo Redisson para heartbeat etc., não para operações de Pub/Sub)
subscriptionConnectionPoolSize: 5

# Número mínimo de conexões de assinatura ociosas
subscriptionConnectionMinimumIdleSize: 1

# Intervalo de monitoramento de DNS (milissegundos)
dnsMonitoringInterval: 5000

# Codec (usado para serialização)
codec: !<org.redisson.codec.JsonJacksonCodec> {}

# Quantidade de threads no pool
threads: 16

# Quantidade de threads no pool do Netty
nettyThreads: 32

# Modo de transporte
transportMode: "NIO"
