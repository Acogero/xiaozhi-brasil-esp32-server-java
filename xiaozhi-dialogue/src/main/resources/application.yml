# ============================================================
# Configuração de implantação independente do Dialogue
# Contém apenas as partes diferentes do server; o restante segue os valores padrão de cada módulo
# ============================================================

server:
  port: 8092

spring:
  # A migração do Flyway é executada apenas no server; o dialogue não a executa, evitando migrações duplicadas em múltiplas instâncias
  flyway:
    enabled: false

  # Configuração da fonte de dados (compartilha o mesmo banco de dados com o server)
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 300000
      pool-name: DialogueHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
      keepalive-time: 30000

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s
      redisson:
        config: classpath:redisson-config.yml

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  threads:
    virtual:
      enabled: true

  # Ativa o ambiente de desenvolvimento, sobrescrevendo esta configuração usando application-dev.yml
  profiles:
    active: dev

mybatis:
  mapper-locations: classpath*:mapper/*.xml,classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false

# ============================================================
# Configuração de log
# ============================================================
logging:
  level:
    root: INFO
    org.springframework: INFO
    io.netty.handler: ERROR

# ============================================================
# Configuração de extensão do Xiaozhi
# ============================================================
xiaozhi:
  runtime:
    native-lib-dir: lib
    vosk-model-dir: models/vosk-model
    tts-models-dir: models/tts
  vad:
    model:
      path: models/silero_vad.onnx
  check:
    inactive:
      session: true

# ============================================================
# Sa-Token (usado apenas para @SaIgnore e validação de interfaces sem estado; a validação do token depende do Redis)
# ============================================================
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-read-cookie: true
  is-read-header: true
  token-prefix: Bearer
  jwt-secret-key: xiaozhi-esp32-server-java-jwt-secret-key
